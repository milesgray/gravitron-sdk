[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "gravitron-sdk"
version = "0.1.0"
description = "Drop-in AgentAPI connection strategy and reactive trigger SDK for Google Antigravity — use your personal Antigravity IDE quota with the official Antigravity Python SDK."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Miles Gray" }]
keywords = ["antigravity", "google-antigravity", "agentapi", "gravitron", "ai-agents", "gemini", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "google-antigravity>=0.1.24",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/milesgray/gravitron-sdk"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gravitron_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
